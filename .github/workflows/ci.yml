name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lingxing-mcp:ci
      - name: Verify production artifacts
        run: |
          test "$(docker run --rm --entrypoint node lingxing-mcp:ci -e 'process.stdout.write(String(process.getuid()))')" = "1000"
          cp deploy/role-mapping.example.json deploy/role-mapping.json
          docker compose -f deploy/compose.yaml config --quiet
          docker run --rm \
            -e MCP_DOMAIN=mcp.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine \
            caddy adapt --config /etc/caddy/Caddyfile --validate >/dev/null
